kind = "web"
previewPath = "/"
title = "Educonz Coaching Centre"
description = "A responsive marketing website for Educonz Coaching Centre in Nazimabad, Karachi, helping students and parents explore Classes IX–XII programs and enquire about admissions."
version = "1.0.0"
id = "artifacts/educonz"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21721

[services.development]
run = "pnpm --filter @workspace/educonz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/educonz", "run", "build" ]
serve = "static"
publicDir = "artifacts/educonz/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21721"
BASE_PATH = "/"
